info:
  name: start-session
  type: http
  seq: 4

http:
  method: POST
  url: "{{API_URL}}:{{API_PORT}}/api/sessions/start"
  body:
    type: json
    data: |-
      {
        "clientSessionId": "sess-{{$randomUUID}}",
        "workoutName": "Day 2 - Beine",
        "sessionType": "STRENGTH",
        "weightUnit": "KG"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
