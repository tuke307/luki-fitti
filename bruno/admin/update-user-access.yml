info:
  name: update-user-access
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{API_URL}}:{{API_PORT}}/api/admin/users/:id/access"
  params:
    - name: id
      value: "USER-ID"
      type: path
  body:
    type: json
    data: |-
      {
        "permissions": ["DASHBOARD_VIEW", "USERS_MANAGE"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
