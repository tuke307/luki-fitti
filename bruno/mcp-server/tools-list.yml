info:
  name: tools-list
  type: http
  seq: 2

http:
  method: POST
  url: "{{MCP_URL}}/mcp"
  headers:
    - name: Authorization
      value: Bearer {{LUKIFITTI_API_KEY}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "tools/list",
        "params": {}
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
