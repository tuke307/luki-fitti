info:
  name: start-raid
  type: http
  seq: 10

http:
  method: POST
  url: "{{API_URL}}:{{API_PORT}}/api/squads/:id/raids"
  params:
    - name: id
      value: "SQUAD-ID"
      type: path
  body:
    type: json
    data: |-
      {
        "bossSlug": "BOSS-SLUG",
        "difficulty": "NORMAL"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
