name: Production

# Deploys only happen when a GitHub release is published from a version tag
# (or manually via workflow_dispatch against a tag). Pushes to main deploy
# nothing — tag.yaml creates the tag, a published release triggers this.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # A release must be built from the tag matching the version in the repo.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - id: v
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Production deploys run from a version tag — pick a v* tag (current ref: ${{ github.ref }})."
            exit 1
          fi
          ref_name="${{ github.ref_name }}"
          version="$(node scripts/version.mjs get)"
          node scripts/version.mjs check
          if [ "$ref_name" != "v$version" ]; then
            echo "::error::Tag $ref_name does not match the repo version v$version — release the tag created by tag.yaml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deploying $version from tag $ref_name"

  build-api:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/luki-fitti-api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-api
          cache-to: type=gha,mode=max,scope=build-api
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}

  build-web:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/luki-fitti-web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-web
          cache-to: type=gha,mode=max,scope=build-web
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}

  build-email-worker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/luki-fitti-email-worker
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/email-worker/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-email-worker
          cache-to: type=gha,mode=max,scope=build-email-worker
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}

  build-db-migrate:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/luki-fitti-db-migrate
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/database/Dockerfile.migration
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-db-migrate
          cache-to: type=gha,mode=max,scope=build-db-migrate
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}

  build-mcp-server:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/luki-fitti-mcp-server
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/mcp-server/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-mcp-server
          cache-to: type=gha,mode=max,scope=build-mcp-server
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}

  deploy:
    needs: [build-api, build-web, build-email-worker, build-db-migrate, build-mcp-server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_MIGRATE_DIGEST: ${{ needs.build-db-migrate.outputs.digest }}
      WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
      API_DIGEST: ${{ needs.build-api.outputs.digest }}
      EMAIL_WORKER_DIGEST: ${{ needs.build-email-worker.outputs.digest }}
      MCP_SERVER_DIGEST: ${{ needs.build-mcp-server.outputs.digest }}
    steps:
      - name: Pin image digests and deploy on Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          # The deploy webhook is https://<host>/api/v1/deploy?uuid=<app-uuid>[&force=…];
          # the base URL and the application UUID are taken from it.
          COOLIFY_URL="${COOLIFY_WEBHOOK%%/api/v1/*}"
          COOLIFY_APP_UUID=""
          if [[ "$COOLIFY_WEBHOOK" =~ [?\&]uuid=([^\&]+) ]]; then
            COOLIFY_APP_UUID="${BASH_REMATCH[1]}"
          fi
          if [ -z "$COOLIFY_WEBHOOK" ] || [ "$COOLIFY_URL" = "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "::error::COOLIFY_WEBHOOK must look like https://<host>/api/v1/deploy?uuid=<app-uuid>."
            exit 1
          fi
          echo "::add-mask::$COOLIFY_URL"
          echo "::add-mask::$COOLIFY_APP_UUID"

          for var in COOLIFY_TOKEN \
            DB_MIGRATE_DIGEST WEB_DIGEST API_DIGEST EMAIL_WORKER_DIGEST MCP_SERVER_DIGEST; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is empty — check the repo secrets and the build job outputs."
              exit 1
            fi
          done
          for var in DB_MIGRATE_DIGEST WEB_DIGEST API_DIGEST EMAIL_WORKER_DIGEST MCP_SERVER_DIGEST; do
            if [[ ! "${!var}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$var is not a valid sha256 digest: ${!var}"
              exit 1
            fi
          done

          # Pin the digests as application env vars — compose.yml interpolates them into image:.
          payload="$(jq -n '{data: [
            {key: "LUKI_FITTI_DB_MIGRATE_DIGEST",   value: $db,   is_preview: false},
            {key: "LUKI_FITTI_WEB_DIGEST",          value: $web,  is_preview: false},
            {key: "LUKI_FITTI_API_DIGEST",          value: $api,  is_preview: false},
            {key: "LUKI_FITTI_EMAIL_WORKER_DIGEST", value: $em,   is_preview: false},
            {key: "LUKI_FITTI_MCP_SERVER_DIGEST",   value: $mcp,  is_preview: false}
          ]}' --arg db "$DB_MIGRATE_DIGEST" --arg web "$WEB_DIGEST" --arg api "$API_DIGEST" \
             --arg em "$EMAIL_WORKER_DIGEST" --arg mcp "$MCP_SERVER_DIGEST")"
          status="$(curl --fail-with-body -sS -o /dev/null -w '%{http_code}' -X PATCH \
            "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID/envs/bulk" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")"
          echo "envs/bulk PATCH → HTTP $status ($(jq '.data | length' <<<"$payload") vars set)"

          deploy_response="$(curl --fail-with-body -sS -X POST \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_TOKEN")"
          deployment_uuid="$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$deploy_response")"
          if [ -z "$deployment_uuid" ]; then
            echo "::error::Coolify deploy response did not contain deployments[0].deployment_uuid"
            exit 1
          fi
          echo "deployment queued: $deployment_uuid"

          # Poll until the deployment reaches a terminal state.
          while true; do
            deployment="$(curl --fail-with-body -sS \
              "$COOLIFY_URL/api/v1/deployments/$deployment_uuid" \
              -H "Authorization: Bearer $COOLIFY_TOKEN")"
            deploy_status="$(jq -r '.status // empty' <<<"$deployment")"
            echo "deployment $deployment_uuid status: $deploy_status"
            case "$deploy_status" in
              finished)
                break
                ;;
              failed | cancelled-by-user)
                echo "::error::Coolify deployment ended with status: $deploy_status"
                exit 1
                ;;
              '')
                echo "::error::Could not read deployment status from Coolify response"
                exit 1
                ;;
            esac
            sleep 15
          done

          {
            echo '### Deployed image digests'
            echo
            echo '| Service | Digest |'
            echo '| --- | --- |'
            echo "| luki-fitti-db-migrate | \`$DB_MIGRATE_DIGEST\` |"
            echo "| luki-fitti-web | \`$WEB_DIGEST\` |"
            echo "| luki-fitti-api | \`$API_DIGEST\` |"
            echo "| luki-fitti-email-worker | \`$EMAIL_WORKER_DIGEST\` |"
            echo "| luki-fitti-mcp-server | \`$MCP_SERVER_DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"
