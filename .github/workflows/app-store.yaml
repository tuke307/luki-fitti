name: App Store

# Archives the iOS app with its watch app and widgets and uploads it to App Store Connect.
# Setup and secrets: docs/app-store-release.md
#
# This repository is public, and so are these logs. Never print a secret or a decoded file, and
# do not add a pull_request trigger or upload artifacts: artifacts are public as well.

on:
  # Like the Coolify deploy: every push to main that touches the Apple apps ships a build.
  push:
    branches:
      - main
    paths:
      - 'apps/apple/**'
      - '.github/workflows/app-store.yaml'
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to App Store Connect (off = only archive and export)
        type: boolean
        default: true

concurrency:
  group: app-store
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # Secrets are passed per step, so that only the steps that need them can read them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROFILE_IOS_BASE64: ${{ secrets.APPLE_PROFILE_IOS_BASE64 }}
          APPLE_PROFILE_WATCH_BASE64: ${{ secrets.APPLE_PROFILE_WATCH_BASE64 }}
          APPLE_PROFILE_WIDGETS_BASE64: ${{ secrets.APPLE_PROFILE_WIDGETS_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID APPLE_DISTRIBUTION_P12_BASE64 APPLE_DISTRIBUTION_P12_PASSWORD \
            APPLE_PROFILE_IOS_BASE64 APPLE_PROFILE_WATCH_BASE64 APPLE_PROFILE_WIDGETS_BASE64 \
            ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is not set, see docs/app-store-release.md"
              missing=1
            fi
          done
          exit "$missing"

      - name: Generate Xcode project
        working-directory: apps/apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install certificate and profiles
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROFILE_IOS_BASE64: ${{ secrets.APPLE_PROFILE_IOS_BASE64 }}
          APPLE_PROFILE_WATCH_BASE64: ${{ secrets.APPLE_PROFILE_WATCH_BASE64 }}
          APPLE_PROFILE_WIDGETS_BASE64: ${{ secrets.APPLE_PROFILE_WIDGETS_BASE64 }}
        run: |
          umask 077

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          base64 --decode <<<"$APPLE_DISTRIBUTION_P12_BASE64" > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          base64 --decode <<<"$APPLE_PROFILE_IOS_BASE64" > "$profiles/LukiFittiIOS.mobileprovision"
          base64 --decode <<<"$APPLE_PROFILE_WATCH_BASE64" > "$profiles/LukiFittiWatch.mobileprovision"
          base64 --decode <<<"$APPLE_PROFILE_WIDGETS_BASE64" > "$profiles/LukiFittiWidgets.mobileprovision"

      # -quiet keeps the certificate holder's name and the profile UUIDs out of the public log.
      - name: Archive
        working-directory: apps/apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -quiet \
            -project LukiFitti.xcodeproj \
            -scheme LukiFittiIOS \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/LukiFitti.xcarchive" \
            -xcconfig Config/AppStore.xcconfig \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export
        working-directory: apps/apple
        run: |
          xcodebuild -exportArchive -quiet \
            -archivePath "$RUNNER_TEMP/LukiFitti.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist Config/ExportOptions-AppStore.plist

      - name: Upload to App Store Connect
        # Pushes have no inputs, so they always upload.
        if: github.event_name == 'push' || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          base64 --decode <<<"$ASC_KEY_P8_BASE64" > "$key_file"
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" --p8-file-path "$key_file"
          echo "Uploaded build $GITHUB_RUN_NUMBER." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/distribution.p12"
