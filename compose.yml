services:
  luki-fitti-db-migrate:
    image: ghcr.io/tuke307/luki-fitti-db-migrate:latest
    pull_policy: always
    restart: 'no'
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - luki_fitti_network
    healthcheck:
      test: ['CMD', 'echo', 'Migration container - no persistent health check needed']
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s

  luki-fitti-web:
    image: ghcr.io/tuke307/luki-fitti-web:latest
    pull_policy: always
    restart: always
    environment:
      - TZ=UTC
      - NODE_ENV=${NODE_ENV}
      - HOSTNAME=0.0.0.0
      - API_URL=http://luki-fitti-api:3001/api
      - JWT_SECRET=${JWT_SECRET}
      # Host routing in proxy.ts: SITE_HOSTNAMES serve the marketing site, APP_ORIGIN the app.
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://app.luki-fitti.tony-luke.de}
    depends_on:
      luki-fitti-api:
        condition: service_healthy
    networks:
      - luki_fitti_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Web domains are set in the Coolify UI (luki-fitti.tony-luke.de and
      # app.luki-fitti.tony-luke.de → this container); Coolify generates the caddy
      # labels. The API service below only attaches /api/* routes to both hosts.
      - 'app.project=luki-fitti'
      - 'app.service=web'

  luki-fitti-api:
    image: ghcr.io/tuke307/luki-fitti-api:latest
    pull_policy: always
    restart: always
    environment:
      - API_PORT=${API_PORT}
      - TZ=UTC
      - NODE_ENV=${NODE_ENV}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_EXPIRY_MS=${ACCESS_TOKEN_EXPIRY_MS}
      - REFRESH_TOKEN_EXPIRY_MS=${REFRESH_TOKEN_EXPIRY_MS}
      - REFRESH_TOKEN_REUSE_GRACE_MS=${REFRESH_TOKEN_REUSE_GRACE_MS}
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_RETRY_DELAY_MS=${EMAIL_RETRY_DELAY_MS}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS}
      - REDIS_URL=${REDIS_URL}
      - UMAMI_URL=${UMAMI_URL}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID}
      - UMAMI_ALLOWED_HOSTNAMES=${UMAMI_ALLOWED_HOSTNAMES}
      # Master key for per-user OpenRouter keys (openssl rand -base64 32); set in the secret store.
      - AI_KEY_ENCRYPTION_KEY=${AI_KEY_ENCRYPTION_KEY}
      - AI_KEY_ENCRYPTION_KEY_PREVIOUS=${AI_KEY_ENCRYPTION_KEY_PREVIOUS:-}
      - AI_KEY_ENCRYPTION_KEY_VERSION=${AI_KEY_ENCRYPTION_KEY_VERSION:-1}
      # SeaweedFS
      - SEAWEEDFS_ENDPOINT=${SEAWEEDFS_ENDPOINT}
      - SEAWEEDFS_PORT=${SEAWEEDFS_PORT}
      - SEAWEEDFS_ACCESS_KEY_API=${SEAWEEDFS_ACCESS_KEY_API}
      - SEAWEEDFS_SECRET_KEY_API=${SEAWEEDFS_SECRET_KEY_API}
      - SEAWEEDFS_USE_SSL=${SEAWEEDFS_USE_SSL}
      - SEAWEEDFS_BUCKET=${SEAWEEDFS_BUCKET:-luki-fitti-meal-photos}
      # Push notifications (each channel optional; disabled when unset)
      - APNS_KEY_P8_BASE64=${APNS_KEY_P8_BASE64:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    depends_on:
      luki-fitti-db-migrate:
        condition: service_completed_successfully
    networks:
      - luki_fitti_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.API_PORT||3001)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      # Attach to the same caddy_1 site block as web, routing /api/* to this container
      - 'caddy_1=https://luki-fitti.tony-luke.de'
      - 'caddy_1.0_handle=/api/*'
      - 'caddy_1.0_handle.reverse_proxy={{upstreams 3001}}'
      # Same for the app subdomain (web domains themselves are set in the Coolify UI)
      - 'caddy_2=https://app.luki-fitti.tony-luke.de'
      - 'caddy_2.0_handle=/api/*'
      - 'caddy_2.0_handle.reverse_proxy={{upstreams 3001}}'
      - 'app.project=luki-fitti'
      - 'app.service=api'

  luki-fitti-email-worker:
    image: ghcr.io/tuke307/luki-fitti-email-worker:latest
    pull_policy: always
    restart: always
    environment:
      - TZ=UTC
      - NODE_ENV=${NODE_ENV}
      - EMAIL_WORKER_PORT=${EMAIL_WORKER_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_RETRY_DELAY_MS=${EMAIL_RETRY_DELAY_MS}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS}
      - REDIS_URL=${REDIS_URL}
      # Push notifications (each channel optional; disabled when unset)
      - APNS_KEY_P8_BASE64=${APNS_KEY_P8_BASE64:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    depends_on:
      luki-fitti-db-migrate:
        condition: service_completed_successfully
    networks:
      - luki_fitti_network
    labels:
      - 'app.project=luki-fitti'
      - 'app.service=email-worker'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.EMAIL_WORKER_PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  luki_fitti_network:
    driver: bridge
