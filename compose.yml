services:
  luki-fitti-db-migrate:
    image: ghcr.io/tuke307/luki-fitti-db-migrate:latest
    pull_policy: always
    restart: 'no'
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - luki_fitti_network
    healthcheck:
      test: ['CMD', 'echo', 'Migration container - no persistent health check needed']
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s

  luki-fitti-web:
    image: ghcr.io/tuke307/luki-fitti-web:latest
    pull_policy: always
    restart: always
    environment:
      - TZ=UTC
      - NODE_ENV=${NODE_ENV}
      - HOSTNAME=0.0.0.0
      - API_URL=http://luki-fitti-api:3001/api
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      luki-fitti-api:
        condition: service_healthy
    networks:
      - luki_fitti_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - 'app.project=luki-fitti'
      - 'app.service=web'

  luki-fitti-api:
    image: ghcr.io/tuke307/luki-fitti-api:latest
    pull_policy: always
    restart: always
    environment:
      - API_PORT=${API_PORT}
      - TZ=UTC
      - NODE_ENV=${NODE_ENV}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_EXPIRY_MS=${ACCESS_TOKEN_EXPIRY_MS}
      - REFRESH_TOKEN_EXPIRY_MS=${REFRESH_TOKEN_EXPIRY_MS}
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_RETRY_DELAY_MS=${EMAIL_RETRY_DELAY_MS}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS}
      - REDIS_URL=${REDIS_URL}
      - UMAMI_URL=${UMAMI_URL}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID}
      - UMAMI_ALLOWED_HOSTNAMES=${UMAMI_ALLOWED_HOSTNAMES}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - S3_ENDPOINT=http://luki-fitti-storage:8333
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET:-luki-fitti-meal-photos}
    depends_on:
      luki-fitti-db-migrate:
        condition: service_completed_successfully
    networks:
      - luki_fitti_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.API_PORT||3001)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      # Attach to the same caddy_1 site block as web, routing /api/* to this container
      - 'caddy_1=https://luki-fitti.tony-luke.de'
      - 'caddy_1.0_handle=/api/*'
      - 'caddy_1.0_handle.reverse_proxy={{upstreams 3001}}'
      - 'app.project=luki-fitti'
      - 'app.service=api'

  # Private S3-compatible storage for meal photos. Not exposed to the internet; the API streams
  # photos to their owner after an ownership check.
  luki-fitti-storage:
    image: chrislusf/seaweedfs:4.01
    restart: always
    command: 'server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json'
    volumes:
      - luki_fitti_storage:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - luki_fitti_network
    labels:
      - 'app.project=luki-fitti'
      - 'app.service=storage'

  luki-fitti-email-worker:
    image: ghcr.io/tuke307/luki-fitti-email-worker:latest
    pull_policy: always
    restart: always
    environment:
      - TZ=UTC
      - NODE_ENV=${NODE_ENV}
      - EMAIL_WORKER_PORT=${EMAIL_WORKER_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_RETRY_DELAY_MS=${EMAIL_RETRY_DELAY_MS}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      luki-fitti-db-migrate:
        condition: service_completed_successfully
    networks:
      - luki_fitti_network
    labels:
      - 'app.project=luki-fitti'
      - 'app.service=email-worker'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.EMAIL_WORKER_PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  luki_fitti_network:
    driver: bridge

volumes:
  luki_fitti_storage:
