name: LukiFitti
options:
  bundleIdPrefix: com.lukifitti
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

# One version for app, watch app and widgets — embedded targets must match.
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  LukiFittiKit:
    path: Packages/LukiFittiKit

targets:
  LukiFittiIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    scheme:
      testTargets:
        - LukiFittiIOSUITests
    sources:
      - path: LukiFittiIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUKIFITTI_BUNDLE_ID_PREFIX).app
        INFOPLIST_FILE: LukiFittiIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: LukiFittiIOS/LukiFittiIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
    postBuildScripts:
      # Debug only: let the Debug build reach the plain-http dev API on the LAN and
      # trigger the Local Network prompt (physical iPhone, e.g. the App Review
      # video). Release keeps the plain Info.plist untouched.
      - name: Debug LAN Info.plist keys
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'LukiFitti connects to the development server on your local network.'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'LukiFitti connects to the development server on your local network.'" "$PLIST"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: LukiFittiKit
        product: LukiFittiKit
      - target: LukiFittiWidgets
        embed: true
      # WatchConnectivity only treats the Watch app as this app's companion (isWatchAppInstalled)
      # when it ships inside the iOS app under Watch/.
      - target: LukiFittiWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  LukiFittiWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    scheme:
      testTargets:
        - LukiFittiWatchUITests
    sources:
      - path: LukiFittiWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUKIFITTI_BUNDLE_ID_PREFIX).app.watchkitapp
        INFOPLIST_FILE: LukiFittiWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: LukiFittiWatch/LukiFittiWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: LukiFittiKit
        product: LukiFittiKit

  LukiFittiWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LukiFittiWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUKIFITTI_BUNDLE_ID_PREFIX).app.widgets
        INFOPLIST_FILE: LukiFittiWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: LukiFittiWidgets/LukiFittiWidgets.entitlements
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: LukiFittiKit
        product: LukiFittiKit

  LukiFittiIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LukiFittiIOSUITests
      # Bundled so AppReviewWalkthroughUITests can base64 it into the app's launch
      # environment — host paths are unreadable on a physical device.
      - path: marketing/assets/demo-meal.jpg
    dependencies:
      - target: LukiFittiIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUKIFITTI_BUNDLE_ID_PREFIX).app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: LukiFittiIOS

  LukiFittiWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: LukiFittiWatchUITests
    dependencies:
      - target: LukiFittiWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUKIFITTI_BUNDLE_ID_PREFIX).app.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: LukiFittiWatch
