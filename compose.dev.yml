services:
  db:
    image: postgres:latest
    restart: always
    ports:
      - 5436:5432 # offset to avoid clashing with other local stacks
    env_file:
      - ./packages/database/.env.production.local
    environment:
      # Pin the Postgres session timezone to UTC so timestamp storage and
      # CURRENT_TIMESTAMP match the app's UTC convention.
      - TZ=UTC
      - PGTZ=UTC
    networks:
      - luki_fitti_network
  db-migrate:
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.migration
    restart: 'no' # Run once and exit
    env_file:
      - ./packages/database/.env.production.local
    depends_on:
      - db
      - redis
    networks:
      - luki_fitti_network
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - 8082:80 # offset to avoid clashing with other local stacks
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
      - mcp-server
    networks:
      - luki_fitti_network
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    env_file:
      - ./apps/web/.env.production.local
    ports:
      - 3002:3000 # offset to avoid clashing with other local stacks
    networks:
      - luki_fitti_network
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    env_file:
      - ./apps/api/.env.production.local
    ports:
      - 3003:3001 # offset to avoid clashing with other local stacks
    depends_on:
      - db-migrate
      - redis
      - mailpit
    networks:
      - luki_fitti_network
  email-worker:
    build:
      context: .
      dockerfile: ./apps/email-worker/Dockerfile
    restart: always
    env_file:
      - ./apps/email-worker/.env.production.local
    depends_on:
      - db-migrate
      - redis
      - mailpit
    networks:
      - luki_fitti_network
  mcp-server:
    build:
      context: .
      dockerfile: ./apps/mcp-server/Dockerfile
    restart: always
    environment:
      - TZ=UTC
      - NODE_ENV=production
      - MCP_SERVER_PORT=3030
      - API_BASE_URL=http://api:3001/api
      - MCP_PUBLIC_URL=http://localhost:8082/mcp
      - MCP_ALLOWED_HOSTS=localhost
    ports:
      - 3030:3030
    depends_on:
      - api
    networks:
      - luki_fitti_network
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - 1025:1025 # SMTP server
      - 8025:8025 # Web UI & HTTP API (http://localhost:8025)
    networks:
      - luki_fitti_network
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: on-failure
    ports:
      - '8335:8333' # S3 API, offset to avoid clashing with other local stacks
    volumes:
      - ~/seaweedfs/luki-fitti:/data
      - ~/seaweedfs/luki-fitti/config:/etc/seaweedfs
    command: >
      server
      -dir=/data
      -filer
      -filer.port=8888
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    networks:
      - luki_fitti_network
  seaweedfs-admin:
    image: chrislusf/seaweedfs:latest
    restart: on-failure
    ports:
      - '127.0.0.1:23648:23646' # admin UI, offset to avoid clashing with other local stacks
    # 4.x binds the unauthenticated admin UI to loopback by default; bind inside the container
    # so the port mapping works, and publish it on the host's loopback only.
    command: admin -master=seaweedfs:9333 -port=23646 -ip=0.0.0.0 -allowInsecureBind
    depends_on:
      - seaweedfs
    networks:
      - luki_fitti_network
  redis:
    image: redis:alpine
    restart: always
    ports:
      - 6382:6379 # offset to avoid clashing with other local stacks
    command: redis-server --appendonly yes
    networks:
      - luki_fitti_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  luki_fitti_network:
    driver: bridge
